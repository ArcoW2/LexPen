# How the token types of this pack look (the usual ones have a look in plaintext\language.yaml). Each list
# has its own type, so it can get a look of its own here.
tokens:
  class: { like: type }
  library: { like: type, italic: true }
  constant: { like: atom }
  method: { like: builtin }
  library-method: { like: builtin }
  variable: { like: variable-2 }
  symbol: { like: atom }
# The tag groups of the word file.
outline:
  - { pattern: '^\s*module\s+([\w.:]+)', name: 1, level: 1 }   # modules
  - { pattern: '^\s*class\s+([\w.:]+)', name: 1, level: 1 }   # classes
  - { pattern: '^\s*def\s+([\w.?!=]+)', name: 1, level: 2 }   # functions

# ---------- Format ----------
# The parameters of the formatter (Format, Enter): the roles of the words and signs of this language and the
# style it uses. See README.md (Format) and docs/plans/executed/PLAN-reformat.md; the indent step is the indent size.
format:
  case: true
  word: '[A-Za-z_@$][A-Za-z0-9_]*[?!]?'
  comments: {line: ['#']}
  strings:
    - {open: '"', escape: '\', lines: true}
    - {open: '''', escape: '\', lines: true}
  keep:
    - '^=begin\b.*?^=end\b.*?$'
    - '<<[~-]?([A-Z_]+).*?^\s*\1$'
  groups:
    - {pair: ['{', '}'], open: same, close: same, base: line, block: true}
    - {pair: ['(', ')'], open: same, close: same, base: word, tight: true}
    - {pair: ['[', ']'], open: same, close: same, base: line}
  blocks:
    open:
      - {w: if, before: '(^\s*|=\s*|\(\s*)$'}
      - {w: unless, before: '(^\s*|=\s*|\(\s*)$'}
      - {w: while, before: '(^\s*|=\s*|\(\s*)$'}
      - {w: until, before: '(^\s*|=\s*|\(\s*)$'}
      - {w: case, before: '(^\s*|=\s*|\(\s*)$'}
      - {w: for, before: '(^\s*|=\s*|\(\s*)$'}
      - {w: def, before: '^\s*((private|protected|public)\s+)?$'}
      - {w: class, before: '^\s*((private|protected|public)\s+)?$'}
      - {w: module, before: '^\s*((private|protected|public)\s+)?$'}
      - {w: begin, before: '(^\s*|=\s*|\(\s*)$'}
      - {w: do, before: '^(?!\s*(while|until|for)\b)'}
    middle:
      - {w: elsif, of: [if, unless]}
      - {w: else, of: [if, unless, case, begin]}
      - {w: when, of: [case]}
      - {w: in, of: [case], lineStart: true}
      - {w: rescue, of: [begin, def, do]}
      - {w: ensure, of: [begin, def, do]}
    close: {end: null}
  ends: [';', "\n"]
  operators: ['&&', '||', and, or]
  compare: ['==', '!=', '<=', '>=', '<', '>', '=~']
  align: ['=']
  continue: ['.', '&.']
  style: {open: same, close: same, base: line, align: 'off', afterClose: same, operator: start, oneLine: keep, parenSpace: 'off'}
