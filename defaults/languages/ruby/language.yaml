# Ruby, made from UltraEdit's wordfiles\ruby.uew. Every part is explained in
# languages\_template\language.yaml; how a pack is made from a word file: languages\README.md.
name: Ruby
extensions: [.rb, .rbw]
aliases: [rb]   # other names it is known by (a markdown fence ```rb, an embedded block); see languages\README.md
firstLine: '^#!.*\bruby\b'   # UltraEdit: LanguageMarker
open: edit
fold: indent
comments: { line: '#', block: ['=begin', '=end'] }
quotes:
  - { open: '"', escape: '\' }
  - { open: "'", escape: '\' }
# The word lists of the word file, words as written there. Each list's name is its token type:
#   keyword         C1 Ruby Keywords
#   class           C2 Ruby Classes/Exceptions
#   library         C3 Ruby Libraries/Modules
#   constant        C4 Ruby Constants/Strings
#   method          C5 Ruby Methods
#   library-method  C6 Ruby Library Methods
#   variable        C7 Variables
#   symbol          C8 Constant/Global/Symbol
words:
  keyword: [BEGIN, END, __FILE__, __LINE__, alias, and, begin, break, case, class, def, 'defined?', do, else,
    elsif, end, ensure, 'false', for, if, in, module, next, nil, not, or, quit, redo, rescue, retry, return,
    self, super, then, 'true', undef, unless, until, when, while, yield]
