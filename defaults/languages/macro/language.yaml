# The macro language of LexPen (docs/plans/executed/PLAN-macros.md): the files in macros\ of the data folder (.lpm).
name: LexPen macro
extensions: [.lpm]
open: edit
fold: indent

caseSensitive: false
comments:
  line: '#'
quotes:
  - { open: '"', escape: '\' }
numbers:
  - '\d+(\.\d+)?'
words:
  keyword: [if, then, elseif, else, endif, switch, case, endswitch, goto, gosub, return, stop, procedure, endprocedure,
    function, endfunction, global, use, ref, and, or, not, contains, starts, ends, matches, opened]
  builtin: [set, inc, dec, append, copy, paste, type, moveto, find, replace, new, show, open, notfound, onerror,
    screen, len, upper, lower, trim, left, right, mid, pos]
  atom: [true, false, 'on', 'off', every, continue, recent, column, start, end, case, word, regex, all, back]
rules:
  - { regex: '\$\$\w+', token: variable-3 }
  - { regex: '\$\w+(?::\w+)?', token: variable-2 }
  - { regex: '^\s*:\w+', token: label }
  - { regex: ':\w+', token: label }

tokens:
  label: { like: def, bold: true, contrast: 10 }
  variable-3: { theme: attr, italic: true }

outline:
  - group: 'Procedures and functions'
    patterns:
      - { pattern: '^\s*(?:procedure|function)\s+(\w+)' }
  - group: 'Labels'
    indent: auto
    patterns:
      - { pattern: '^\s*:(\w+)' }
