# How the token types of this pack look (the usual ones have a look in plaintext\language.yaml). Each list
# has its own type, so it can get a look of its own here.
tokens:
  entity: { like: atom }
  dash: { like: meta, underline: true }
# The tag groups of the word file.
outline:
  - { pattern: '<(?:[a-z]+\s[^>]*\bid|a\s[^>]*\bname)=["\'']([^"\''].*?)["\'']', name: 1, level: 1, flags: i }   # anchors
  - { pattern: '<form\s[^>]*\bname=["\'']([^"\''].*?)["\'']', name: 1, level: 1, flags: i }   # forms
  - { pattern: '<a\s[^>]*\bhref=["\'']([^"\''#].*?)["\'']', name: 1, level: 2, flags: i }   # external links
  - { pattern: '<a\s[^>]*\bhref=["\''](#.*?)["\'']', name: 1, level: 2, flags: i }   # local links
  - { pattern: '<img\s[^>]*\bsrc=["\'']([^"\''].*?)["\'']', name: 1, level: 2, flags: i }   # images
  - { pattern: '<script\s[^>]*\bsrc=["\'']([^"\''].*?)["\'']', name: 1, level: 2, flags: i }   # scripts
  - { pattern: '<link\s[^>]*\bhref=["\'']([^"\''].*?\.css)["\'']', name: 1, level: 2, flags: i }   # stylesheets

# Blocks of other languages: the lines between a <script> and a </script> line are JavaScript, between <style> and
# </style> CSS, between <?php and ?> PHP. Only markers on lines of their own (a block is whole lines).
embedded:
  - { openRegex: '^\s*<script\b[^>]*>\s*$', closeRegex: '^\s*</script>', language: javascript, flags: i }
  - { openRegex: '^\s*<style\b[^>]*>\s*$', closeRegex: '^\s*</style>', language: css, flags: i }
  - { openRegex: '^\s*<\?php\s*$', closeRegex: '^\s*\?>', language: php, flags: i }

# ---------- Format ----------
# The parameters of the formatter (Format, Enter): the roles of the words and signs of this language and the
# style it uses. See README.md (Format) and docs/plans/executed/PLAN-reformat.md; the indent step is the indent size.
format:
  markup: true
  case: false
  void: [area, base, br, col, embed, hr, img, input, link, meta, source, track, wbr]
  verbatimElements: [pre, textarea, script, style]
  autoClose:
    li: [li]
    td: [td, th]
    th: [td, th]
    tr: [tr, td, th]
    option: [option]
    dt: [dt, dd]
    dd: [dt, dd]
    p: [p]
    div: [p]
    ul: [p]
    ol: [p]
    table: [p]
    h1: [p]
    h2: [p]
    h3: [p]
    h4: [p]
    h5: [p]
    h6: [p]
    pre: [p]
    form: [p]
    blockquote: [p]
    hr: [p]
    section: [p]
    article: [p]
    header: [p]
    footer: [p]
