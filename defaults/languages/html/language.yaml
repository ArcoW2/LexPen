aliases: [htm, xhtml]   # other names it is known by (a markdown fence ```htm, an embedded block); see languages\README.md
open: edit
fold: indent
caseSensitive: false               # UltraEdit: Nocase
comments: { block: ['<!--', '-->'] }   # UltraEdit: Noquote, so no strings
rules:
  - { regex: '[\u2013\u2014\u00a0]', token: dash }   # C4 Dashes and NBSP (the word file's own bytes, as characters)
