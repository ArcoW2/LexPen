# VBScript, made from UltraEdit's wordfiles\vbscript.uew. Every part is explained in
# languages\_template\language.yaml; how a pack is made from a word file: languages\README.md.
name: VBScript
extensions: [.vbs]
aliases: [vbs]   # other names it is known by (a markdown fence ```vbs, an embedded block); see languages\README.md
open: edit
fold: indent
caseSensitive: false               # UltraEdit: Nocase
comments: { line: "'", moreLines: ['rem '], block: ['/*', '*/'], moreBlocks: [['<!--', '-->']] }
quotes:
  - { open: '"', double: true }    # "say ""hi""": a quote inside is written twice
# The word lists of the word file, words as written there. Each list's name is its token type:
#   tag       C1 Tags
#   builtin   C2 VBFunctions
#   method    C3 VBMethods
#   event     C4 VBEvents
#   keyword   C5 VBStatements
#   object    C6 Objects
#   constant  C7 Constants
