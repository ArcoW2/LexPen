# C#. Every part is explained in languages\_template\language.yaml.
name: C#
extensions: [.cs, .csx]
aliases: ['c#', cs]   # other names it is known by (a markdown fence ```c#, an embedded block); see languages\README.md
open: edit
mode: text/x-csharp     # built in
fold: brace
comments: { line: '//', block: ['/*', '*/'] }
names: { separator: '.', quotes: ['@'] }   # how its names are written (go to definition): see README.md, Outline
outline:   # the groups of csharp.uew (/TGBegin), in its order
  - group: 'Functions'
    definition: true   # its entries are definitions (go to definition)
    patterns:
      - { pattern: '^\s*(?:(?:public|private|protected|internal|static|virtual|override|async|abstract|sealed|extern|unsafe|new|partial)\s+)+[\w<>\[\],.?() ]+?\s+(\w+)\s*(?:<[^>]*>)?\s*\(', case: true }
  - group: 'Classes'
    definition: true   # its entries are definitions (go to definition)
    patterns:
      - { pattern: '^\s*(?:\[[^\]]*\]\s*)*(?:(?:public|private|protected|internal|static|sealed|abstract|partial|readonly|unsafe|file|ref)\s+)*(?:class|interface|record|struct|enum)\s+(\w+)', case: true }
actions:
  snippetTry:
    title: 'Snippet: try / catch'
    insert: "try\n{\n    $0\n}\ncatch (Exception ex)\n{\n}\n"
  snippetIf:
    title: 'Snippet: if'
    insert: "if ($0)\n{\n}\n"
  snippetForeach:
    title: 'Snippet: foreach'
    insert: "foreach (var item in $0)\n{\n}\n"
  snippetProperty:
    title: 'Snippet: property'
    insert: 'public string $0 { get; set; }'

# ---------- Format ----------
# The parameters of the formatter (Format, Enter): the roles of the words and signs of this language and the
# style it uses. See README.md (Format) and docs/plans/executed/PLAN-reformat.md; the indent step is the indent size.
format:
  case: true
  word: '[A-Za-z_@$][A-Za-z0-9_$]*'
  comments: {line: ['//'], block: [['/*', '*/']]}
  strings:
    - {open: '@"', close: '"', double: true, lines: true}
    - {open: '$"', close: '"', escape: '\'}
    - {open: '"', escape: '\'}
    - {open: '''', escape: '\'}
  groups:
    - {pair: ['{', '}'], open: next, close: own, base: line, openAt: next, afterClose: next, block: true}
    - {pair: ['(', ')'], open: same, close: same, base: word, afterClose: same, tight: true}
    - {pair: ['[', ']'], open: same, close: same, base: word, afterClose: same, tight: true}
  blocks:
    open:
      - {w: if, kind: single, closes: false, afterGroup: true}
      - {w: for, kind: single, closes: false, afterGroup: true}
      - {w: foreach, kind: single, closes: false, afterGroup: true}
      - {w: while, kind: single, closes: false, afterGroup: true}
      - {w: using, kind: single, closes: false, afterGroup: true}
      - {w: lock, kind: single, closes: false, afterGroup: true}
      - {w: fixed, kind: single, closes: false, afterGroup: true}
      - {w: else, kind: single, closes: false, when: '^\s*(//.*)?$'}
      - {w: do, kind: single, closes: false, when: '^\s*(//.*)?$'}
      - {w: case, before: '^\s*$', inside: ['{'], closes: false, endsBefore: [case, default, '}']}
      - {w: default, before: '^\s*$', when: '^\s*:', inside: ['{'], closes: false, endsBefore: [case, default, '}']}
  singleBody: ['{']
  ends: [';']
  operators: ['&&', '||']
  continue: ['.', '?.', '?', ':', '??', '+', '=>']
  compare: ['==', '!=', '<=', '>=', '<', '>']
  align: ['=']
  keepLines: ['^\s*#\s*(if|else|elif|endif|define|undef|pragma|nullable|line|error|warning)\b']
  style: {open: same, close: own, base: line, align: 'off', afterClose: next, operator: start, oneLine: keep, parenSpace: 'off'}
  trail: [';', ',', ')', ']', '}', '.']
