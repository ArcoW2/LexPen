# Java, made from UltraEdit's wordfiles\java.uew. Every part is explained in
# languages\_template\language.yaml; how a pack is made from a word file: languages\README.md.
name: Java
extensions: [.jav, .java]
open: edit
fold: brace
comments: { line: '//', block: ['/*', '*/'] }
quotes:                            # UltraEdit: no String Chars, its default " and '
  - { open: '"', escape: '\' }
  - { open: "'", escape: '\' }
# The word lists of the word file, words as written there. Each list's name is its token type:
#   keyword  C1 Keywords
#   class    C2 Classes
# Not coloured: C3 Operators (signs only, or as noted).
words:
  keyword: [abstract, boolean, break, byte, case, catch, char, class, continue, default, do, double, else,
    extends, 'false', final, finally, float, for, if, implements, import, instanceof, int, interface, length,
    long, native, new, 'null', package, private, protected, public, return, short, static, super, switch,
    synchronized, this, threadsafe, throw, throws, transient, 'true', try, void, while]
  class: [AWTError, AWTEvent, AWTEventMulticaster, AWTException, AbstractMethodError, AccessException, Acl,
