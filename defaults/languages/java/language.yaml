# How the token types of this pack look (the usual ones have a look in plaintext\language.yaml). Each list
# has its own type, so it can get a look of its own here.
tokens:
  class: { like: type }
# The tag groups of the word file.
names: { separator: '.' }   # how its names are written (go to definition): see README.md, Outline
outline:   # the groups of java.uew (/TGBegin), in its order
  - group: 'Imports'
    patterns:
      - { pattern: '^import\s+([\w.*]+);', case: true }
  - group: 'Methods'
    definition: true   # its entries are definitions (go to definition)
    patterns:
      - { pattern: '^\s*(?:(?:public|protected|private|static|final|abstract|synchronized|native)\s+)+[\w<>\[\],.?\s]*?(\w+)\s*\(', case: true }

# ---------- Format ----------
# The parameters of the formatter (Format, Enter): the roles of the words and signs of this language and the
# style it uses. See README.md (Format) and docs/plans/executed/PLAN-reformat.md; the indent step is the indent size.
format:
  case: true
  word: '[A-Za-z_@$][A-Za-z0-9_$]*'
  comments: {line: ['//'], block: [['/*', '*/']]}
  strings:
    - {open: '"""', close: '"""', lines: true}
    - {open: '"', escape: '\'}
    - {open: '''', escape: '\'}
  groups:
    - {pair: ['{', '}'], open: next, close: own, base: line, openAt: same, afterClose: same, block: true}
    - {pair: ['(', ')'], open: same, close: same, base: word, afterClose: same, tight: true}
    - {pair: ['[', ']'], open: same, close: same, base: word, afterClose: same, tight: true}
  blocks:
    open:
      - {w: if, kind: single, closes: false, afterGroup: true}
      - {w: for, kind: single, closes: false, afterGroup: true}
      - {w: while, kind: single, closes: false, afterGroup: true}
      - {w: else, kind: single, closes: false, when: '^\s*(//.*)?$'}
      - {w: do, kind: single, closes: false, when: '^\s*(//.*)?$'}
      - {w: case, before: '^\s*$', inside: ['{'], closes: false, endsBefore: [case, default, '}']}
      - {w: default, before: '^\s*$', when: '^\s*:', inside: ['{'], closes: false, endsBefore: [case, default, '}']}
      - {w: synchronized, kind: single, closes: false, afterGroup: true}
  singleBody: ['{']
  ends: [';']
  operators: ['&&', '||']
  continue: ['.', '?.', '?', ':', '??', '+', '=>']
  compare: ['==', '!=', '<=', '>=', '<', '>']
  align: ['=']
  keepLines: []
  style: {open: same, close: own, base: line, align: 'off', afterClose: next, operator: start, oneLine: keep, parenSpace: 'off'}
  trail: [';', ',', ')', ']', '}', '.']
  joinAfterClose: [else, catch, finally, while]
