  highlight: [atomic, raise, raiserror]
  global: ['@@*']
  local: ['@_*']
  variable: ['@*']
  constant: ['_*']
# How the token types of your own look (the usual ones have a look in plaintext\language.yaml). Each has its
# own name, so you can give it a look of its own here.
tokens:
  reserved: { like: keyword }
  procedure: { like: builtin }
  sysobject: { like: type }
  highlight: { like: keyword, bold: true }
  constant: { like: atom }
  global: { like: variable-2, contrast: 10 }     # @@: the strongest (as in the shipped SQL pack)
  variable: { like: variable-2 }                 # @
  local: { like: variable-2, contrast: -10 }     # @_: the subtlest
# Blocks of another language: the King API definition, JSON on the lines between the line with /*==[ and the
# line with ]==*/ (both marker lines stay SQL comment). See languages\README.md (embedded).
embedded:
  - { open: '/*==[', close: ']==*/', language: json }
# The tag groups of the word file: procedures / functions / triggers, tables, regions, TODO, API definitions.
outline:   # the groups of Sybase_ASA_SQL.uew (/TGBegin), in its order
  - group: 'TODO'
    indent: auto    # under what is above it (a procedure, a region)
    parent: false   # but never above what follows: a region after a TODO stays under the procedure
    patterns:
      - { pattern: '//.*\s*(TODO|ACW|!@#):*\s+([^0-9].+)$' }   # the tag and the text, joined
  - group: 'APIdefs King Communicator'
    patterns:
      - { pattern: '^\s*"StoredProcName"\s*:\s*"([0-9a-z_]*)"' }
  - group: 'Procs/Funcs/triggers'
    patterns:
      - { pattern: '^\s*create\s+(?:or\s+replace\s+)?(procedure|function|view|event|domain)\s+([\w".]+)' }
      - { pattern: '^\s*create\s+or\s+replace\s+trigger\s+([\w".]+)' }
  - group: 'Regions'
    indent: auto    # under the procedure or table above it (merged in line order)
    patterns:
      - { pattern: '(?://\s*---|(?://|--)\$region)\s?((?:(?!\s---).)+)' }
      - { pattern: '^\s*begin\s*(?:--|//)\s*(.+)$' }
      - { pattern: '^\s*//\s*\*\*\*\s?([^*]+)\**$', case: true }
  - group: 'Tables'
    patterns:
      - { pattern: '^\s*create\s+(?:or\s+replace\s+)?table\s+([\w".]+)' }

# ---------- Format ----------
# The parameters of the formatter (Format, Enter): the roles of the words and signs of this language and the
# style it uses. See README.md (Format) and docs/plans/executed/PLAN-reformat.md; the indent step is the indent size.
format:
  case: false
  word: '[A-Za-z_@#$][A-Za-z0-9_@#$]*(?:\.[A-Za-z_@#$][A-Za-z0-9_@#$]*)*'
  comments: {line: ['//', '--'], block: [['/*', '*/']]}
  strings:
    - {open: '''', double: true}
    - {open: '"', double: true}
  groups:
    - {pair: ['(', ')'], tight: true}
  blocks:
    open:
      - {w: begin, breakAfter: true}
      - {w: if, until: [then]}
      - {w: case}
      - {w: loop, breakAfter: true, before: '^\s*(\w+:\s*)?$'}
      - {w: while, until: [loop], before: '^\s*(\w+:\s*)?$'}
      - {w: for, until: [do], before: '^\s*(\w+:\s*)?$', when: '^(?!\s*(read\s+only|update|xml|json)\b)'}   # not a cursor's FOR READ ONLY / FOR UPDATE, a select's FOR XML / FOR JSON
      - {w: when, inside: [case, exception], until: [then], closes: false, endsBefore: [when, else, end case, end]}
      - {w: exception, inside: [begin], before: '^\s*$', closes: false, endsBefore: [end]}
      - {w: else, inside: [case], closes: false, endsBefore: [when, end case, end]}
    middle:
      - {w: else, of: [if], breakAfter: true}
      - {w: elseif, of: [if], until: [then]}
    close: {end if: if, endif: if, end case: case, end loop: [loop, while], end for: for, end: [begin, case]}
  ends: [';']
  statements:
    select: [into, from, where, group by, having, order by, union, union all, for read only, for update, for xml, for json]
    update: [set, from, where]
    insert: [values, select]
    delete: [from, where]
    set: []
    call: []
    return: []
    declare: []
    message: []
  items:
    join: {start: [left outer join, right outer join, full outer join, inner join, cross join, left join, right join, join], clause: ['on']}
  operators: [and not, or not, and, or, xor]
  compare: [is not distinct from, is distinct from, is not, not like, like, not in, in, between, '<>', '!=', '<=', '>=', '=', '<', '>', is]
  align: [default]
  separators: [',']
  longLimit: 2
  clauseGap: 4
  style: {open: same, close: own, base: word, align: 'on', alignClause: 'off', afterClose: next, operator: start, longClause: next, oneLine: keep, parenSpace: 'off'}
