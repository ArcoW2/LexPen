# Sybase ASA SQL (SQL Anywhere), made from UltraEdit's wordfiles\Sybase_ASA_SQL.uew. Every part is explained
# in languages\_template\language.yaml.
name: Sybase ASA SQL
# The extensions of the word file, .sql included: SQL files open as ASA SQL (the SQL pack keeps the others).
extensions: [.sql, .evn, .sp, .tr, .vw, .ws, .do]
aliases: [sqlanywhere, sybase]   # other names it is known by (a markdown fence ```sqlanywhere, an embedded block); see languages\README.md
open: edit
fold: indent                       # UltraEdit: EnableCFByIndent
caseSensitive: false               # UltraEdit: Nocase
comments: { line: '//', moreLines: ['--'], block: ['/*', '*/'] }   # Toggle comment uses //
quotes:
  - { open: "'", double: true }    # 'it''s': a quote inside is written twice
# The word lists of Sybase_ASA_SQL.uew. Each list's name is its token type:
#   keyword     C1 Transact SQL Reserved Words and C2 SQL-92 Reserved word
#   reserved    C3 SQL-92 Potential Reserved word
#   procedure   C4 Built in stored procedures
#   sysobject   C5 System Objects, Default Owner
#   global      C6 Global variables (@@...)
#   local       C7 Local variables in local block (@_...)
#   variable    C8 Local variables (@...)
#   builtin     C9 Built in functions
#   highlight   C10 Highlights
#   constant    C11 Constants (_...)
# C12 Domains (datatypes) is empty in the word file.
