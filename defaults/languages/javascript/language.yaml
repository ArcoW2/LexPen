# JavaScript. Every part is explained in languages\_template\language.yaml.
name: JavaScript
extensions: [.js, .mjs, .cjs, .jsx]
aliases: [js, node, jsx]   # other names it is known by (a markdown fence ```js, an embedded block); see languages\README.md
open: edit
mode: javascript        # built in
fold: brace
comments: { line: '//', block: ['/*', '*/'] }
outline:   # the groups of javascript.uew (/TGBegin), in its order
  - group: 'Named Functions'
    patterns:
      - { pattern: '^\s*(?:export\s+)?(?:async\s+)?function\s*\*?\s*(\w+)', case: true }
  - group: 'Anonymous Functions'
    patterns:
      - { pattern: '^\s*(?:export\s+)?(?:const|let|var)\s+(\w+)\s*=\s*(?:async\s+)?(?:function|\([^)]*\)\s*=>|\w+\s*=>)', case: true }
  - group: 'Classes'
    patterns:
      - { pattern: '^\s*(?:export\s+)?(?:default\s+)?class\s+(\w+)', case: true }
actions:
  snippetFunction:
    title: 'Snippet: function'
    insert: "function $0() {\n}\n"
  snippetTry:
    title: 'Snippet: try / catch'
    insert: "try {\n  $0\n} catch (e) {\n}\n"

# ---------- Format ----------
# The parameters of the formatter (Format, Enter): the roles of the words and signs of this language and the
# style it uses. See README.md (Format) and docs/plans/executed/PLAN-reformat.md; the indent step is the indent size.
format:
  case: true
  word: '[A-Za-z_$][A-Za-z0-9_$]*'
  comments: {line: ['//'], block: [['/*', '*/']]}
  strings:
    - {open: '`', escape: '\', lines: true}
    - {open: '"', escape: '\'}
    - {open: '''', escape: '\'}
  groups:
    - {pair: ['{', '}'], open: next, close: own, base: line, openAt: same, afterClose: same, block: true}
    - {pair: ['(', ')'], open: same, close: same, base: word, afterClose: same, tight: true}
    - {pair: ['[', ']'], open: same, close: same, base: word, afterClose: same, tight: true}
  blocks:
    open:
      - {w: if, kind: single, closes: false, afterGroup: true}
      - {w: for, kind: single, closes: false, afterGroup: true}
      - {w: while, kind: single, closes: false, afterGroup: true}
      - {w: else, kind: single, closes: false, when: '^\s*(//.*)?$'}
      - {w: do, kind: single, closes: false, when: '^\s*(//.*)?$'}
      - {w: case, before: '^\s*$', inside: ['{'], closes: false, endsBefore: [case, default, '}']}
      - {w: default, before: '^\s*$', when: '^\s*:', inside: ['{'], closes: false, endsBefore: [case, default, '}']}
  singleBody: ['{']
  ends: [';', "\n"]
  operators: ['&&', '||']
  continue: ['.', '?.', '?', ':', '??', '+', '=>']
  compare: ['===', '!==', '==', '!=', '<=', '>=', '<', '>']
  align: ['=']
  keepLines: []
  style: {open: same, close: own, base: line, align: 'off', afterClose: next, operator: start, oneLine: keep, parenSpace: 'off'}
  trail: [';', ',', ')', ']', '}', '.']
  keep:
    - {re: '/(?![*/])(?:\\.|\[(?:\\.|[^\]\n])*\]|[^/\\\n])+/[dgimsuy]*', after: '(,=:[!&|?{};'}
  joinAfterClose: [else, catch, finally, while]
