    CreateDragImage, CreateEmbed, CreateField, CreateGroup, CreateIndex, CreateLink, CreatePreparedStatement,
    CreatePropery, CreateQuery, CreateQueryDef, CreateRelation, CreateTableDef, CreateUser, CreateWorkspace,
    Customize, Delete, DeleteColumnLabels, DeleteColumns, DeleteRowLabels, DeleteRows, DoVerb, Drag, Draw, Edit,
    EditCopy, EditPaste, EndDoc, EnsureVisible, EstablishConnection, Execute, ExtractIcon, Fetch, FetchVerbs,
    FileExists, Files, FillCache, Find, FindFirst, FindItem, FindLast, FindNext, FindPrevious, FolderExists,
    Forward, GetBookmark, GetChunk, GetClipString, GetData, GetFirstVisible, GetFormat, GetHeader,
