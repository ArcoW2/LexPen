  keyword: [AppActivate, Base, Beep, Boolean, ByRef, ByVal, Call, Case, ChDir, ChDrive, Const, Declare, DefBool,
    DefByte, DefCur, DefDate, DefDbl, DefDec, DefInt, DefLng, DefObj, DefSng, DefStr, DefVar, Deftype,
