    For, ForEach, Friend, Function, Get, GoSub, GoTo, If, Implements, Imports, Integer, Kill, LSet, Let,
    LineInput, Lock, Me, MkDir, MyBase, Name, Namespace, New, Next, Nothing, 'On', OnError, Option, Overrides,
    Private, Property, Protected, Public, Put, RSet, RaiseEvent, Randomize, ReDim, ReadOnly, Rem, Reset, Resume,
    Return, RmDir, SavePicture, SaveSetting, SendKeys, SetAttr, Static, Structure, Sub, Then, To, 'True', Type,
