# How the token types of this pack look (the usual ones have a look in plaintext\language.yaml). Each list
# has its own type, so it can get a look of its own here.
tokens:
  method: { like: def }
  event: { like: attribute }
# The tag groups of the word file.
outline:
  - { pattern: '^\s*(?:(?:public|private)\s+)*function\s+([a-z]\w*)', name: 1, level: 1, flags: i }   # functions
  - { pattern: '^\s*(?:(?:public|private)\s+)*sub\s+([a-z]\w*)', name: 1, level: 1, flags: i }   # subs
