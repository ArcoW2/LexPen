# Visual Basic, made from UltraEdit's wordfiles\visualbasic.uew. Every part is explained in
# languages\_template\language.yaml; how a pack is made from a word file: languages\README.md.
name: Visual Basic
extensions: [.bas, .frm, .cls, .vb, .vba, .ctl, .dsr]
aliases: [vbnet, visualbasic, vba]   # other names it is known by (a markdown fence ```vbnet, an embedded block); see languages\README.md
open: edit
fold: indent
comments: { line: "'" }
quotes:                            # UltraEdit: no String Chars; VB writes a quote inside as two
  - { open: '"', double: true }
# The word lists of the word file, words as written there. Each list's name is its token type:
#   builtin  C1 Functions
#   method   C2 Methods
#   event    C3 Events
#   keyword  C4 Statements
# Not coloured: C5 Operators (signs only, or as noted).
words:
  builtin: [Abs, Array, Asc, AscB, AscW, Atn, Avg, CBool, CByte, CCur, CDate, CDbl, CInt, CLng, CSng, CStr,
    CVDate, CVErr, CVar, Cdec, Choose, Chr, ChrB, ChrW, Command, Cos, Count, CreateObject, CurDir, DDB, Date,
    DateAdd, DateDiff, DatePart, DateSerial, DateValue, Day, Dir, DoEvents, EOF, Environ, Error, Exp, FV,
    FileAttr, FileDateTime, FileLen, Fix, Format, FreeFile, GetAllStrings, GetAttr, GetAutoServerSettings,
    GetObject, GetSetting, Hex, Hour, IIf, IMEStatus, IPmt, InStr, Input, InputB, InputBox, InstB, Int, IsArray,
    IsDate, IsEmpty, IsError, IsMissing, IsNull, IsNumeric, IsObject, LBound, LCase, LOF, LTrim, Left, LeftB,
    Len, LenB, LoadPicture, Loc, MIRR, Max, Mid, MidB, Min, Minute, Month, MsgBox, NPV, NPer, Now, Oct, PPmt, PV,
    Partition, Pmt, QBColor, RGB, RTrim, Rate, Replace, Right, RightB, Rnd, SLN, SYD, Second, Seek, Sgn, Shell,
    Sin, Space, Spc, Split, Sqr, StDev, StDevP, Str, StrComp, StrConv, String, Sum, Switch, Tab, Tan, Time,
    TimeSerial, TimeValue, Timer, Trim, TypeName, UBound, UCase, Val, Var, VarP, VarType, Weekday, Year]
  method: [Accept, Activate, Add, AddCustom, AddFile, AddFromFile, AddFromTemplate, AddItem, AddNew,
    AddToAddInToolbar, AddToolboxProgID, Append, AppendChunk, Arrange, Assert, AsyncRead, BatchUpdate,
