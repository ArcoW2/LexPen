# XML, and the files that are XML (project files, configuration, XAML, SVG, ...).
# Every part is explained in languages\_template\language.yaml.
name: XML
extensions: [.xml, .csproj, .vbproj, .fsproj, .props, .targets, .config, .xaml, .axaml, .svg, .resx, .nuspec, .xsd, .xsl, .xslt, .manifest]
open: edit
mode: xml               # built in
fold: indent
comments: { block: ['<!--', '-->'] }
actions:
  # Pretty print: the selection (whole elements) or the whole file, indented; comments, CDATA and the declaration
  # stay, and text mixed with elements keeps its spacing.
  format: { title: Reformat XML, hint: 'Indented and readable; comments, CDATA, the declaration and mixed content stay', format: rules }

# ---------- Format ----------
# The parameters of the formatter (Format, Enter): the roles of the words and signs of this language and the
# style it uses. See README.md (Format) and docs/plans/executed/PLAN-reformat.md; the indent step is the indent size.
format:
  markup: true
  case: true
  align: ['=']
  style: {open: next, close: own, base: line, align: 'off', oneLine: split}
