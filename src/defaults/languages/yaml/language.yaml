# YAML. Every part is explained in languages\_template\language.yaml.
name: YAML
extensions: [.yaml, .yml]
aliases: [yml]   # other names it is known by (a markdown fence ```yml, an embedded block); see languages\README.md
open: edit
mode: yaml              # built in
fold: indent
comments: { line: '#' }
outline:
  - { pattern: '^([A-Za-z_][\w.-]*)\s*:', name: 1, level: 1 }   # top-level keys
tokens:
  atom: { like: property }            # keys
  def: { theme: fgDim }               # anchors and aliases
# Editing keys: Enter after "key:" indents the next line a step; after "- item" it starts the next item (on an empty
# one the list ends); Tab anywhere in an item indents it; a new line keeps the indentation.
editing:
  indentAfter: ':\s*(#.*)?$'
  lists:
    markers: ['- ']
  tabInListItem: indent
  keepIndent: true
