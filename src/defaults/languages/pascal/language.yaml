# Delphi / Pascal. Coloured by this file: the word lists and patterns below.
# Form files (.dfm) are not Pascal and are left to plain text.
# Every part is explained in languages\_template\language.yaml.
name: Delphi / Pascal
extensions: [.pas, .dpr, .dpk, .lpr, .pp, .inc]
aliases: [delphi, objectpascal]   # other names it is known by (a markdown fence ```delphi, an embedded block); see languages\README.md
open: edit
fold: indent
caseSensitive: false
comments: { line: '//', block: ['{', '}'], moreBlocks: [['(*', '*)']] }
quotes:
  - { open: "'", double: true }                  # 'it''s'
words:
  keyword: [absolute, abstract, and, array, as, asm, begin, case, class, const, constructor, destructor,
    dispinterface, div, do, downto, dynamic, else, end, except, exports, external, file, finalization,
    finally, for, forward, function, goto, if, implementation, in, inherited, initialization, inline,
    interface, is, label, library, message, mod, nil, not, object, of, on, or, out, overload, override,
    packed, private, procedure, program, property, protected, public, published, raise, record, reintroduce,
    repeat, resourcestring, sealed, set, shl, shr, static, strict, string, then, threadvar, to, try, type,
    unit, until, uses, var, virtual, while, with, xor]
  type: [boolean, byte, cardinal, char, currency, double, extended, int64, integer, longint, nativeint,
    pointer, real, shortint, single, smallint, tdatetime, uint64, variant, word, ansistring, unicodestring,
    widestring, tobject, tstrings, tstringlist]
  atom: ['true', 'false', self, result]
rules:
  - { regex: '#\d+', token: string }             # character codes: #13#10
  - { regex: '\$[0-9a-fA-F]+', token: number }   # $FF
names: { separator: '.', quotes: ['&'], case: false }   # how its names are written (go to definition): see README.md, Outline
# The unit's sections at level 1, its types and routines under them. A routine only at the line's start: the methods
# declared inside a class or record (indented) are no entries, their implementations (TMatch.Test) are.
outline:
  - { pattern: '^\s*(interface|implementation|initialization|finalization)\s*(?://.*|\{.*\}|\(\*.*\*\))?$', name: 1, level: 1, flags: i }
  - { pattern: '^\s*(\w+)\s*=\s*(?:packed\s+)?(?:class|record|interface)\b', name: 1, level: 2, flags: i, definition: true }
  - { pattern: '^(?:class\s+)?(?:procedure|function|constructor|destructor)\s+([\w.]+)', name: 1, level: 2, flags: i, definition: true }
actions:
  section:
    title: Section
    hint: To the next / previous procedure or function
    jump: { line: '^\s*(class\s+)?(procedure|function|constructor|destructor)\b', flags: i }
    variants: [[1], [-1]]
    variantTitles: { '1': Next section, '-1': Previous section }
  snippetTry:
    title: 'Snippet: try / finally'
    insert: "try\n  $0\nfinally\nend;\n"
  snippetBegin:
    title: 'Snippet: begin / end'
    insert: "begin\n  $0\nend;\n"

# ---------- Format ----------
# The parameters of the formatter (Format, Enter): the roles of the words and signs of this language and the
# style it uses. See README.md (Format) and docs/plans/executed/PLAN-reformat.md; the indent step is the indent size.
format:
  case: false
  word: '[A-Za-z_][A-Za-z0-9_]*'
  comments: {line: ['//'], block: [['{', '}'], ['(*', '*)']]}
  strings:
    - {open: '''', double: true}
  groups:
    - {pair: ['(', ')'], open: same, close: same, base: word, tight: true}
    - {pair: ['[', ']'], open: same, close: same, base: word, tight: true}
  blocks:
    open:
      - {w: begin, breakAfter: true}
      - {w: try, breakAfter: true}
      - {w: asm}
      - {w: repeat, breakAfter: true}
      - {w: case, until: [of]}
      - {w: record, before: '(=|:)\s*(packed\s+)?$'}
      - {w: class, before: '=\s*$', when: '^(?!\s*;)(?!\s+of\b)'}
      - {w: interface, before: '=\s*$', when: '^(?!\s*;)'}
      - {w: object, before: '=\s*$'}
      - {w: var, before: '^\s*$', when: '^\s*$', closes: false, endsBefore: [begin, var, const, type, label, procedure, function, constructor, destructor, implementation, initialization, finalization, class procedure, class function, 'end.']}
      - {w: const, before: '^\s*$', when: '^\s*$', closes: false, endsBefore: [begin, var, const, type, label, procedure, function, constructor, destructor, implementation, initialization, finalization, class procedure, class function, 'end.']}
      - {w: type, before: '^\s*$', when: '^\s*$', closes: false, endsBefore: [begin, var, const, type, label, procedure, function, constructor, destructor, implementation, initialization, finalization, class procedure, class function, 'end.']}
      - {w: uses, before: '^\s*$', closes: false, endsAfter: [';']}
      - {w: if, kind: single, closes: false, until: [then], body: single, endsBefore: [else]}
      - {w: while, kind: single, closes: false, until: [do], body: single}
      - {w: for, kind: single, closes: false, until: [do], body: single}
      - {w: with, kind: single, closes: false, until: [do], body: single}
      - {w: 'on', kind: single, closes: false, until: [do], body: single, inside: [try]}
      - {w: else, kind: single, closes: false, when: '^\s*(//.*)?$'}
    middle:
      - {w: except, of: [try], breakAfter: true}
      - {w: finally, of: [try], breakAfter: true}
      - {w: else, of: [case], breakAfter: true}
      - {w: private, of: [class, object], lineStart: true}
      - {w: protected, of: [class, object], lineStart: true}
      - {w: public, of: [class, object], lineStart: true}
      - {w: published, of: [class, object], lineStart: true}
      - {w: strict private, of: [class, object], lineStart: true}
    close: {end: [begin, try, asm, case, record, class, interface, object], until: repeat}
  singleBody: [begin]
  freeClosers: ['end\.']
  ends: [';']
  operators: [and, or, xor, and not, or not]
  compare: ['<>', '<=', '>=', '=', '<', '>', in, is]
  align: [':=']
  style: {open: same, close: same, base: line, align: 'off', afterClose: same, operator: start, oneLine: keep, parenSpace: 'off'}
