<!doctype html>
<!-- The Columns pane as a page of its own (columns-pane.js; docs/plans/executed/PLAN-csv-columns.md 3.2). -->
<html><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:">
<title>Columns</title>
<link rel="stylesheet" href="app.css">
<style>
  body { background: var(--bg-side); color: var(--fg); display: flex; flex-direction: column; height: 100vh; margin: 0; overflow: hidden;
    font-family: var(--app-font); font-size: calc(13px * var(--ui-scale, 1)); }
  input, select, textarea, button { font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--border); border-radius: 3px; }
  input, select { padding: 1px 4px; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); }
  button { padding: 2px 10px; background: var(--bg-bar); cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  /* A narrow dock: the tabs and the name wrap onto more rows, the name above the tabs (wrap-reverse: the first row,
     the tabs, stays at the bottom, against what they show); the name is cut only when it alone is wider. */
  .cp-name { flex: 1 0 auto; max-width: 100%; padding: 0 0 3px 10px; box-sizing: border-box; align-self: center; text-align: right; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cp-beside { font-weight: 400; color: var(--fg-dim); }
  .cp-empty { padding: 10px; color: var(--fg-dim); }
  .cp-empty button { margin-top: 8px; }
  .cp-main { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .cp-file { flex: 1; min-height: 0; overflow: auto; display: grid; grid-template-columns: auto 1fr; grid-auto-rows: min-content; gap: 6px 8px; align-items: center; padding: 8px 10px; }
  .cp-file label { color: var(--fg-dim); white-space: nowrap; }
  .cp-file .cp-line { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .cp-file input.cp-short { width: 5ch; }
  .cp-file input[type=number] { width: 7ch; }
  .cp-tabs { flex: none; display: flex; flex-wrap: wrap-reverse; gap: 2px; padding: 6px 10px 0; border-bottom: 1px solid var(--border); }
  .cp-tabs button { border-bottom: 0; border-radius: 3px 3px 0 0; background: var(--bg-side); }
  .cp-tabs button.cp-on { background: var(--bg); border-color: var(--accent); }
  .cp-list { flex: 1; min-height: 0; overflow: auto; }
  .cp-list table { border-collapse: collapse; }
  .cp-list th { position: sticky; top: 0; z-index: 1; background: var(--bg-side); text-align: left; font-weight: 600; color: var(--fg-dim); padding: 4px 4px; white-space: nowrap; border-bottom: 1px solid var(--border); }
  .cp-list td { padding: 2px 4px; white-space: nowrap; border-bottom: 1px solid color-mix(in srgb, var(--border) 50%, transparent); }
  .cp-list tr.cp-ticked td { background: color-mix(in srgb, var(--accent) 10%, transparent); }
  .cp-list tr.cp-flash td { background: color-mix(in srgb, var(--accent) 30%, transparent); transition: background .3s; }
  .cp-list td.cp-n { color: var(--fg-dim); text-align: right; }
  .cp-list td.cp-sample { max-width: 16ch; overflow: hidden; text-overflow: ellipsis; color: var(--fg-dim); font-family: var(--editor-font, Consolas, monospace); }
  .cp-list input.cp-text { width: 12ch; }
  .cp-list input.cp-sign { width: 3ch; text-align: center; }
  .cp-list input.cp-num { width: 5ch; }
  .cp-warn { color: var(--warning); cursor: help; }
  .cp-def { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 6px 10px; gap: 4px; }
  .cp-def textarea { flex: 1; resize: none; font-family: var(--editor-font, Consolas, monospace); font-size: calc(12px * var(--ui-scale, 1)); padding: 4px; white-space: pre; }
  .cp-def-error { color: var(--warning); min-height: 1.3em; }
  .cp-bar { flex: none; display: flex; gap: 6px; padding: 6px 10px; border-top: 1px solid var(--border); flex-wrap: wrap; }
  .cp-kept { display: inline-flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; margin-left: 6px; }   /* narrow: its choices on rows of their own */
  .cp-kept > * { white-space: nowrap; }
  .cp-kept-label { color: var(--fg-dim); }
  .cp-kept input { vertical-align: middle; margin: 0 2px 0 0; }
  .cp-kept label.cp-off { opacity: .5; }
  .cp-note { color: var(--fg-dim); padding: 0 10px 4px; }
  .cp-menu { position: fixed; z-index: 10; background: var(--bg-bar); border: 1px solid var(--border); border-radius: 4px; padding: 3px 0; }
  .cp-menu button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 3px 14px; }
  .cp-menu button:focus { background: var(--hover); outline: none; }   /* marked: the focus (menukeys.js), not :hover */
  .cp-menu:focus { outline: none; }
</style>
</head>
<body>
<div class="cp-empty" hidden></div>
<div class="cp-main" hidden>
  <div class="cp-tabs"><button type="button" data-tab="file" title="How the file is built: delimiter, first data line, header line, quotes">File</button><button type="button" class="cp-on" data-tab="columns">Columns</button><button type="button" data-tab="definition">Definition</button>
    <span class="cp-name"></span></div>
  <div class="cp-file" hidden>
    <label for="cp-delim">Delimiter</label>
    <div class="cp-line"><input id="cp-delim" class="cp-short" list="cp-delims" title="One or more characters; \t is a tab">
      <datalist id="cp-delims"><option value=","><option value=";"><option value="\t"><option value="|"><option value=" "></datalist>
      <label><input type="checkbox" id="cp-trim"> Trim spaces</label></div>
    <label for="cp-skip">First data line</label>
    <div class="cp-line"><input type="number" id="cp-skip" min="1" title="The line the data starts on (1: the first); the lines above it, the header line among them, are not data"></div>
    <label for="cp-header">Header line</label>
    <div class="cp-line"><select id="cp-header" title="Which of the lines before the data holds the column names"></select></div>
    <label for="cp-quote">Quote</label>
    <div class="cp-line"><input id="cp-quote" class="cp-short" title="The start quote; empty: none"> <input id="cp-quote-end" class="cp-short" title="The end quote"></div>
    <label for="cp-escape">Escape</label>
    <div class="cp-line"><select id="cp-escape" title="How an end quote inside the text is written">
        <option value="double">doubled ("")</option><option value="char">escape character</option><option value="none">not escaped</option></select>
      <input id="cp-escape-char" class="cp-short" title="The escape character"></div>
  </div>
  <div class="cp-list"><table><thead></thead><tbody></tbody></table></div>
  <div class="cp-def" hidden><textarea spellcheck="false"></textarea><div class="cp-def-error"></div></div>
  <div class="cp-note"></div>
  <div class="cp-bar">
    <button type="button" class="cp-apply" title="The preview redraws with these settings, and they are kept (Ctrl+Enter)">Apply</button>
    <button type="button" class="cp-revert" title="Back to the kept settings">Revert</button>
    <button type="button" class="cp-detect" title="Forget the settings and guess them again from the text">Detect</button>
    <button type="button" class="cp-info" title="Per column: its type, longest and shortest value, how many are empty and how many do not fit (as applied)">Column info</button>
    <span class="cp-kept"><span class="cp-kept-label">Settings kept:</span>
      <label><input type="radio" name="cp-kept" value="lexpen"> in LexPen</label>
      <label class="cp-kept-file"><input type="radio" name="cp-kept" value="file"> next to the file</label></span>
  </div>
</div>
<script src="pane.js"></script>
<script src="menukeys.js"></script>
<script src="csv.js"></script>
<script src="columns-pane.js"></script>
</body></html>
