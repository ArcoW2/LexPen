<!doctype html>
<!-- The Folder pane as a page of its own (folder-pane.js; docs/plans/executed/PLAN-docking.md 3.3). -->
<html><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:">
<title>Folder</title>
<link rel="stylesheet" href="app.css">
<style>body { background: var(--bg-side); display: flex; flex-direction: column; height: 100vh; margin: 0; overflow: hidden; user-select: none; }</style>
</head>
<body class="mm-folder-page">
<div class="mm-tree-head">
  <span class="mm-tree-title">No folder open</span>
  <span class="mm-tree-wide">
    <select class="mm-sort" title="Sort by">
      <option value="modified">Modified</option>
      <option value="name">Name</option>
      <option value="extension">Extension</option>
      <option value="size">Size</option>
    </select>
    <button data-cmd="sortDir" class="mm-sort-dir" title="Ascending / descending"></button>
    <button data-cmd="knownOnly" class="mm-known-only mm-tree-toggle" title="Show known file types only (the extensions of the language packs)">Known</button>
    <button data-cmd="hiddenFiles" class="mm-hidden-files mm-tree-toggle" title="Also the hidden files and folders, and those starting with a dot">Hidden</button>
    <button data-cmd="fileSizes" class="mm-file-sizes mm-tree-toggle" title="Each file's size after its name">Size</button>
  </span>
  <button class="mm-tree-view" title="Filter, view and order">View &#9662;</button>
  <button data-cmd="refresh" title="Refresh">&#10227;</button>
</div>
<div class="mm-tree" tabindex="0"></div>
<script src="pane.js"></script>
<script src="folder-pane.js"></script>
</body></html>
