<!doctype html>
<!-- The Folder pane as a page of its own (folder-pane.js; docs/plans/executed/PLAN-docking.md 3.3). -->
<html><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:">
<title>Folder</title>
<link rel="stylesheet" href="app.css">
<style>body { background: var(--bg-side); display: flex; flex-direction: column; height: 100vh; margin: 0; overflow: hidden; user-select: none; }</style>
</head>
<body class="mm-folder-page">
<div class="mm-tree-head">
  <button class="mm-tree-sort mm-tree-drop" title="Sort: Modified, Name, Extension or Size, up or down (folders first)"><span class="mm-tree-label mm-tree-sort-label">Modified</span><span class="mm-tree-sort-dir"></span><span class="mm-tree-caret">&#9662;</span></button>
  <button class="mm-tree-filter mm-tree-drop" title="Filter: known file types only, the hidden folders and files"><svg class="mm-tree-icon" viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"><path d="M2 3h12L9.5 8.5V13l-3-1.5v-3z"/></svg><span class="mm-tree-label">Filter</span><span class="mm-tree-caret">&#9662;</span></button>
  <button class="mm-tree-recent" title="Recent folders"><svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><circle cx="8" cy="8" r="6"/><path d="M8 4.5V8l2.5 1.5"/></svg></button>
  <span class="mm-tree-gap"></span>
  <button class="mm-tree-view mm-tree-drop" title="What the rows show"><svg class="mm-tree-icon" viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M1.5 8s2.5-4.5 6.5-4.5S14.5 8 14.5 8 12 12.5 8 12.5 1.5 8 1.5 8z"/><circle cx="8" cy="8" r="2"/></svg><span class="mm-tree-label">View</span><span class="mm-tree-caret">&#9662;</span></button>
  <button data-cmd="refresh" title="Refresh">&#10227;</button>
</div>
<div class="mm-tree" tabindex="0"></div>
<script src="pane.js"></script>
<script src="folder-pane.js"></script>
</body></html>
