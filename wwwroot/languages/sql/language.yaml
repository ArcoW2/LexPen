# SQL (T-SQL, PostgreSQL, Oracle: the common words). Coloured by this file: the word lists and patterns
# below, so you can add your own words. Every part is explained in languages\_template\language.yaml.
name: SQL
# Currently this pack does not contain .sql for that is themed by asa language
extensions: [.ddl, .pks, .pkb]
open: edit
fold: indent
caseSensitive: false
comments: { line: '--', block: ['/*', '*/'] }
quotes:
  - { open: "'", double: true }                  # 'it''s': a quote inside is written twice
  - { open: '"', token: variable-2 }             # "quoted identifier"
  - { open: '[', close: ']', token: variable-2 } # [bracketed identifier]
words:
  keyword: [add, all, alter, and, any, as, asc, begin, between, by, case, cascade, check, close, column,
    commit, constraint, create, cross, cursor, database, declare, default, delete, desc, distinct, drop, else,
    end, escape, except, exec, execute, exists, fetch, for, foreign, from, full, function, go, grant, group,
    having, if, in, index, inner, insert, intersect, into, is, join, key, left, like, limit, merge, natural,
    not, of, offset, on, open, or, order, outer, over, partition, primary, print, procedure, proc, raiserror,
    references, replace, return, returns, revoke, right, rollback, row, rows, schema, select, set, table, then,
    top, tran, transaction, trigger, truncate, union, unique, update, use, using, values, view, when, where,
    while, with]
  type: [bigint, binary, bit, blob, boolean, char, clob, date, datetime, datetime2, datetimeoffset, decimal,
    double, float, int, integer, money, nchar, ntext, number, numeric, nvarchar, real, smallint, text, time,
    timestamp, tinyint, uniqueidentifier, varbinary, varchar, varchar2, xml]
  builtin: [abs, avg, cast, ceiling, coalesce, concat, convert, count, current_timestamp, dateadd, datediff,
    floor, getdate, isnull, len, length, lower, ltrim, max, min, newid, nullif, replace, round, row_number,
    rtrim, substring, sum, trim, upper]
  atom: ['null', 'true', 'false']
  # Variables, by how they start (a word ending in * is every word starting with it; the longest first):
  global: ['@@*']                                # global variables: @@rowcount, @@error
  local: ['@_*']                                 # local variables: @_count
  variable: ['@*']                               # other variables and parameters: @id
rules:
  - { regex: ':\w+', token: variable }          # bind variables
# How your own token types look: like a built-in type (its theme colour), with a style.
# All variables, one stronger than the other: contrast is lightness points further from the background.
tokens:
  global: { like: variable-2, contrast: 10 }     # @@: the strongest
  variable: { like: variable-2 }                 # @: as variable-2 in the theme
  local: { like: variable-2, contrast: -10 }     # @_: the subtlest
outline:
  - pattern: '^\s*create\s+(?:or\s+(?:replace|alter)\s+)?(?:procedure|proc|function|view|trigger|table|package(?:\s+body)?)\s+([\w.\[\]"]+)'
    name: 1
    level: 1
    flags: i
actions:
  section:
    title: Section
    hint: To the next / previous CREATE, ALTER or GO
    jump: { line: '^\s*(create|alter|go)\b', flags: i }
    variants: [[1], [-1]]
    variantTitles: { '1': Next section, '-1': Previous section }
  snippetSelect:
    title: 'Snippet: select'
    insert: "SELECT $0\nFROM \nWHERE "
  snippetInsert:
    title: 'Snippet: insert'
    insert: "INSERT INTO $0 ()\nVALUES ()"
  snippetUpdate:
    title: 'Snippet: update'
    insert: "UPDATE $0\nSET \nWHERE "
  snippetProcedure:
    title: 'Snippet: create procedure'
    insert: "CREATE PROCEDURE $0\nAS\nBEGIN\n    SET NOCOUNT ON;\nEND\nGO\n"
