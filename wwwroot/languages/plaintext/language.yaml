# Plain text, and the base for every language: an action a language does not have itself is taken from
# here, and so are the icons of the bar. The comment actions work in every language that has comment
# markers (its own "comments", or those of its editor mode); plain text has none, so there they are greyed out.
# Every part is explained in languages\_template\language.yaml.
name: Plain text
open: edit
fold: none
actions:
  toggleComment: { title: Toggle comment, hint: 'Comments the selected lines, or uncomments them when they are', command: toggleComment }
  blockComment: { title: Toggle block comment, hint: 'Around the selection; inside a block comment: removes it', command: blockComment }
  removeBlockComment: { title: Remove block comment, hint: The block comment the cursor is in, command: removeBlockComment }
  indent: { title: Indent, hint: The selected lines one level in, command: indent }
  outdent: { title: Outdent, hint: The selected lines one level out, command: outdent }
  section:
    title: Section
    hint: To the next / previous paragraph
    jump: { line: '\S', after: '^\s*$' }
    variants: [[1], [-1]]
    variantTitles: { '1': Next section, '-1': Previous section }

# ---------- The looks of the token types (the base for every language) ----------
# Every piece of text has a token type; its look comes from here, or from a language's own "tokens" on top.
# theme: a theme colour (keyword, string, comment, number, title, attr, fg, fgDim, accent, ...), like: the
# look of another type, contrast, bold, italic, underline, strikethrough, byTheme. A type without a look
# looks like text. Explained in languages\_template\language.yaml.
tokens:
  text: { theme: fg }                 # everything else: the editor's own text
  keyword: { theme: keyword }
  atom: { like: keyword }             # constants: true, null
  tag: { like: keyword }              # XML tags
  bracket: { like: keyword }          # XML < >
  string: { theme: string }
  string-2: { like: string }
  comment: { theme: comment, italic: true }
  number: { theme: number }
  builtin: { like: number }           # built-in functions
  type: { theme: title }
  def: { like: type }                 # names being defined
  variable-2: { like: type }
  variable-3: { like: type }
  property: { theme: attr }           # JSON keys, object properties
  attribute: { like: property }       # XML attributes, C# [attributes]
  meta: { theme: fgDim }              # preprocessor lines, annotations
  error: { like: text }               # what a built-in mode does not know (PowerShell)
