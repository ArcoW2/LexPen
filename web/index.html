<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- script-src 'self' also blocks inline scripts/handlers coming from a document's raw HTML.
     connect-src 'self': the page reads its own files (the language packs). -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: http: data: blob:; font-src 'self' data:; media-src https: http:; connect-src 'self'">
<title>LexPen</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="app.css">
</head>
<body data-busy>

<!-- Buttons with data-action run that action; their tooltip shows its key (see showKeys). -->
<header class="mm-toolbar">
  <button data-action="sidebar.toggle">&#9776;</button>
  <nav class="mm-menubar"></nav>
  <span class="mm-doc-name"></span>
  <button data-action="save" class="mm-save">Save</button>
  <button data-cmd="orient" class="mm-orient" title="Panes side by side / above each other (also in the divider's right-click menu)"></button>
  <span class="mm-switches">
    <button data-action="editor.toggle" class="mm-switch-editor" data-title="Show / hide the editor">Editor</button>
    <button data-action="preview.toggle" class="mm-switch-preview" data-title="Show / hide the preview">Preview</button>
  </span>
  <button data-action="outline.toggle" class="mm-outline-button">Outline</button>
  <button data-action="theme.toggle" class="mm-theme"></button>
  <button data-action="zoomReset" class="mm-zoom" data-key-action="zoomIn" data-title="Preview zoom: click for 100%. Zoom in / out">100%</button>
</header>

<main class="mm-main">
  <aside class="mm-sidebar">
    <div class="mm-side-tabs">
      <button data-cmd="viewFolder" class="mm-side-tab mm-side-folder">Folder</button>
      <button data-cmd="viewSearch" class="mm-side-tab mm-side-search">Search</button>
    </div>
    <div class="mm-folder-view">
    <div class="mm-tree-head">
      <span class="mm-tree-title">No folder open</span>
      <select class="mm-sort" title="Sort by">
        <option value="name">Name</option>
        <option value="modified">Modified</option>
      </select>
      <button data-cmd="sortDir" class="mm-sort-dir" title="Ascending / descending"></button>
      <button data-cmd="markdownOnly" class="mm-md-only" title="Show markdown files only">M&#8595;</button>
      <button data-cmd="refresh" title="Refresh">&#10227;</button>
    </div>
    <div class="mm-tree"></div>
    </div>
    <div class="mm-search-view">
      <input class="mm-search-input" type="text" spellcheck="false" placeholder="Search, then Enter"
        title="Codes: ^p line break (CR, LF or CRLF), ^t tab, ^? any character, ^# digit, ^$ letter, ^w spaces or tabs, ^^ the ^ itself">
      <div class="mm-search-bar">
        <button data-opt="case" title="Match case">Aa</button>
        <button data-opt="word" title="Whole word only">W</button>
        <button data-opt="regex" title="Regular expression (then the ^ codes do not apply)">.*</button>
        <select class="mm-search-scope" title="Where to search">
          <option value="file">Current file</option>
          <option value="open">Open files</option>
          <option value="folder">Files in folder</option>
        </select>
      </div>
      <div class="mm-search-status"></div>
      <div class="mm-search-results"></div>
    </div>
  </aside>
  <div class="mm-splitter"></div>
  <div class="mm-work">
  <!-- The compare (compare.js): its bar above the panes, the line strip below them. -->
  <div class="mm-cmp-bar" hidden>
    <span class="mm-cmp-files">Compare</span>
    <span class="mm-cmp-count"></span>
    <label title="Spaces and tabs: their amount inside a line, all of them at the ends; an empty line against none"><input type="checkbox" data-cmp-opt="compareWhitespace"> Ignore whitespace</label>
    <label><input type="checkbox" data-cmp-opt="compareCase"> Ignore case</label>
    <button data-cmp="align" title="Compare the left cursor line and the right cursor line as each other's match, and what follows from there (Ctrl+F7); again on a tied pair: untie">Align</button>
    <button data-cmp="untie" title="Undo every tie made with Align" hidden>Untie all</button>
    <button data-cmp="copyLeft" title="The selected lines, or else the difference at the cursor: the right side's lines over the left side's (Alt+Left)">&lt;&lt;</button>
    <button data-cmp="copyRight" title="The selected lines, or else the difference at the cursor: the left side's lines over the right side's (Alt+Right)">&gt;&gt;</button>
    <button data-cmp="swap" title="Left and right change places">Swap</button>
    <span class="mm-cmp-note"></span>
    <span class="mm-cmp-gap"></span>
    <button data-cmp="close" title="Leave the compare">&#10005;</button>
  </div>
  <!-- The two panes are built by app.js around the divider. -->
  <div class="mm-panes">
    <div class="mm-divider" hidden title="Drag to resize; right-click for the pane menu (orientation, hide, close)">
      <button data-cmd="sync" class="mm-sync" title="Scroll both panes together"></button>
      <!-- Level (plan 13): two pieces of text, the right one lower, and the arrow between the panes; above each other:
           the arrow up-down on the right. -->
      <button data-cmd="level" class="mm-level" title="Level the two panes so they start scrolling from the same line number">
        <svg class="mm-level-v" viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M2 2.5h4M2 4.5h4M2 6.5h3M10 5h4M10 7h4M10 9h3M2 13h12M4 11l-2 2 2 2M12 11l2 2-2 2"/></svg>
        <svg class="mm-level-h" viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 3.5h4M1.5 5.5h4M1.5 7.5h3M7 6.5h4M7 8.5h4M7 10.5h3M13.5 2v12M11.5 4l2-2 2 2M11.5 12l2 2 2-2"/></svg>
      </button>
      <!-- Comparing: the previous and next difference in place of the scroll-together button (compare.js). -->
      <button data-cmp="prev" class="mm-cmp-go" title="Previous difference (Shift+F7)">&#8593;</button>
      <button data-cmp="next" class="mm-cmp-go" title="Next difference (F7)">&#8595;</button>
    </div>
  </div>
  <div class="mm-cmp-strip" hidden>
    <div class="mm-cmp-labels"><div class="mm-cmp-label"></div><div class="mm-cmp-label"></div></div>
    <div class="mm-cmp-texts"><div class="mm-cmp-text"></div><div class="mm-cmp-text"></div></div>
  </div>
  </div>
</main>

<!-- Bottom bar: the active pane's file (see updateStatus). -->
<footer class="mm-status">
  <button class="mm-st-project" title="This window's project (click: the Projects menu)"></button>
  <span class="mm-st-panes"><span class="mm-st-pane" data-pane="0"></span><span class="mm-st-pane" data-pane="1"></span></span>
  <span class="mm-st-chord"></span>
  <span class="mm-st-fill"></span>
  <span class="mm-st-pos"></span>
  <button class="mm-st-char" hidden></button>
  <button class="mm-st-col" title="Column mode (Alt+C); click: off" hidden>COL</button>
  <button class="mm-st-ins" title="Insert / overwrite (Ins)"></button>
  <span class="mm-st-long" title="The editor colours only the first 10,000 characters of a line; the rest is plain text" hidden>Long line: colour stops at 10,000 characters</span>
  <span class="mm-st-enc" title="Encoding: the file is saved the way it was read"></span>
  <span class="mm-st-eol" title="Line endings"></span>
  <button class="mm-st-lang" title="Language (click: choose another)"></button>
  <button class="mm-st-clip" title="The active clipboard">Clip: Win</button>
  <span class="mm-st-alive" title="Turns while LexPen responds; when it stands still, LexPen is busy"></span>
</footer>

<div class="mm-toast" hidden></div>

<div class="mm-menu mm-context mm-tree-menu" hidden>
  <button data-cmd="treeSetRoot">Set as root of the folder pane</button>
  <button data-cmd="copyPath">Copy path</button>
  <button data-cmd="copyRelativePath">Copy relative path</button>
  <button data-cmd="treeFavourite" class="mm-fav-item">Add to favourites</button>
  <hr>
  <button data-cmd="treeCompareActive">Compare with the file in the editor</button>
  <button data-cmd="treeCompareWith">Compare with...</button>
  <button data-cmd="treeCompareFolder">Compare with folder...</button>
  <button data-cmd="treeCompareLeft">Select as left side to compare</button>
  <button data-cmd="treeCompareTo" hidden>Compare to</button>
</div>

<div class="mm-menu mm-context mm-tab-menu" hidden>
  <button data-cmd="tabOtherPane">Move to other pane</button>
  <button data-cmd="tabSplit" data-key-of="split">Split into the other pane</button>
  <button data-cmd="tabNextWindow">Move to next window</button>
  <button data-cmd="tabNewWindow">Open in new window</button>
  <hr>
  <button data-cmd="tabCopyPath">Copy full name to clipboard</button>
  <button data-cmd="tabShowInTree" class="mm-file-item">Show in folder pane</button>
  <button data-cmd="tabFavourite" class="mm-fav-item">Add to favourites</button>
  <hr>
  <button data-cmd="tabPin" data-key-of="pin.toggle">Pin tab</button>
  <button data-cmd="tabReadOnly" data-key-of="readOnly.toggle" class="mm-check">Read-only</button>
  <button data-cmd="tabRevert" data-key-of="revertToSaved">Revert to saved</button>
  <hr>
  <button data-cmd="tabCompareWith">Compare with...</button>
  <button data-cmd="tabCompareOther">Compare with the tab in the other pane</button>
  <button data-cmd="tabCompareSaved">Compare with the saved file</button>
  <button data-cmd="tabCompareLeft">Select as left side to compare</button>
  <button data-cmd="tabCompareTo" hidden>Compare to</button>
  <hr>
  <button data-cmd="tabClose" data-key-of="closeTab">Close</button>
  <button data-cmd="tabCloseOthers">Close other tabs</button>
  <button data-cmd="tabCloseRight">Close tabs to the right</button>
  <button data-cmd="tabCloseAll" data-key-of="closeAllTabs">Close all tabs</button>
  <hr class="mm-pane-sep">
  <button data-cmd="paneHide" class="mm-pane-item">Hide this pane</button>
  <button data-cmd="paneHideOther" class="mm-pane-item">Hide other pane</button>
  <button data-cmd="paneClose" class="mm-pane-item">Close this pane</button>
  <button data-cmd="paneCloseOther" class="mm-pane-item">Close other pane</button>
  <button data-cmd="paneShow" class="mm-pane-item">Show hidden pane</button>
</div>

<div class="mm-menu mm-context mm-strip-menu" hidden>
  <button data-cmd="stripReopen" data-key-of="reopenTab">Reopen closed tab</button>
  <button data-cmd="stripCloseAll" data-key-of="closeAllTabs">Close all tabs</button>
  <hr class="mm-pane-sep">
  <button data-cmd="paneHide" class="mm-pane-item">Hide this pane</button>
  <button data-cmd="paneHideOther" class="mm-pane-item">Hide other pane</button>
  <button data-cmd="paneClose" class="mm-pane-item">Close this pane</button>
  <button data-cmd="paneCloseOther" class="mm-pane-item">Close other pane</button>
  <button data-cmd="paneShow" class="mm-pane-item">Show hidden pane</button>
</div>

<!-- The button at the right end of a pane's tab strip. -->
<div class="mm-menu mm-context mm-pane-menu" hidden>
  <button data-cmd="paneHide" class="mm-pane-item">Hide this pane</button>
  <button data-cmd="paneHideOther" class="mm-pane-item">Hide other pane</button>
  <button data-cmd="paneClose" class="mm-pane-item">Close this pane</button>
  <button data-cmd="paneCloseOther" class="mm-pane-item">Close other pane</button>
  <button data-cmd="paneShow" class="mm-pane-item">Show hidden pane</button>
</div>

<!-- Right-click on the divider; the labels follow the orientation (see showDividerMenu). -->
<div class="mm-menu mm-context mm-divider-menu" hidden>
  <button data-cmd="orientV" class="mm-check mm-orient-v">Side by side</button>
  <button data-cmd="orientH" class="mm-check mm-orient-h">Above each other</button>
  <hr>
  <button data-cmd="hideFirst" class="mm-first">Hide left pane</button>
  <button data-cmd="hideSecond" class="mm-second">Hide right pane</button>
  <button data-cmd="closeFirst" class="mm-first">Close left pane</button>
  <button data-cmd="closeSecond" class="mm-second">Close right pane</button>
</div>

<!-- F1: every action with its key; Enter runs the selected one (palette.js). -->
<dialog class="mm-about mm-palette">
  <input class="mm-pal-search" type="text" spellcheck="false" placeholder="Search a command, key or name; Enter runs it">
  <div class="mm-pal-list"></div>
  <p class="mm-pal-foot"></p>
</dialog>

<!-- A name (a project): askName in app.js. -->
<dialog class="mm-about mm-name-dialog">
  <form method="dialog">
    <label class="mm-name-label" for="mm-name-input"></label>
    <input id="mm-name-input" class="mm-name-input" type="text" spellcheck="false" placeholder="Empty: a number">
    <div class="mm-name-buttons"><button value="ok">OK</button><button value="cancel" type="button" class="mm-name-cancel">Cancel</button></div>
  </form>
</dialog>

<dialog class="mm-about mm-note-dialog">
  <form method="dialog">
    <label class="mm-note-label" for="mm-note-text"></label>
    <textarea id="mm-note-text" class="mm-note-text" rows="5" spellcheck="true" placeholder="A note on this highlight (Ctrl+Enter: OK; empty: no note)"></textarea>
    <div class="mm-name-buttons"><button value="ok">OK</button><button value="cancel" type="button" class="mm-note-cancel">Cancel</button></div>
  </form>
</dialog>

<dialog class="mm-about mm-confirm-dialog">
  <form method="dialog">
    <p class="mm-confirm-text"></p>
    <div class="mm-name-buttons"><button value="ok">OK</button><button value="cancel" type="button" class="mm-confirm-cancel">Cancel</button></div>
  </form>
</dialog>

<dialog class="mm-about mm-about-dialog">
  <h1>LexPen</h1>
  <p class="mm-about-line">Fast, intuitive and flexible text and code editor for Windows, with a built-in viewer.</p>
  <p class="mm-about-created">Created by Arco Witter</p>
  <p class="mm-about-by"><em>Inspired by an idea from Reinier.</em></p>
  <div class="mm-about-body"></div>
  <form method="dialog"><button class="mm-about-ok">OK</button></form>
</dialog>

<script src="vendor/core.js"></script>
<script src="keys.js"></script>
<script src="history.js"></script>
<script src="languages.js"></script>
<script src="actions.js"></script>
<script src="palette.js"></script>
<script src="fontlist.js"></script>
<script src="menus.js"></script>
<script src="favourites.js"></script>
<script src="tabs.js"></script>
<script src="reformat.js"></script>
<script src="convert.js"></script>
<script src="column.js"></script>
<script src="virtual.js"></script>
<script src="cursors.js"></script>
<script src="locate.js"></script>
<script src="ruler.js"></script>
<script src="charpicker.js"></script>
<script src="places.js"></script>
<script src="app.js"></script>
<script src="compare.js"></script>
<script src="previewjump.js"></script>
<script src="sourcemap.js"></script>
<script src="highlights.js"></script>
<script src="previewoverview.js"></script>
</body>
</html>
