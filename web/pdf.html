<!doctype html>
<!-- A PDF, drawn by pdf.js (pdf-pane.js; docs/plans/38-PLAN-pdf-view.md): a page of the panes' site, a process of its own. -->
<html><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; connect-src 'self' https://file.lexpen.example">
<title>PDF</title>
<link rel="stylesheet" href="vendor/pdfjs/pdf_viewer.css">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--pdf-bg, #525659); }
  #pdf-scroll { position: absolute; inset: 0; overflow: auto; }
  .pdfViewer .page { margin: 8px auto; border: 0; box-shadow: 0 1px 4px rgb(0 0 0 / .4); }
  /* A page that does not suit the mode (pdf-pane.js): its lightness turned round, its hues kept. */
  .pdfViewer .page.pdf-inverted .canvasWrapper { filter: invert(var(--pdf-invert, 1)) hue-rotate(180deg); }
  #pdf-error { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 20px;
    color: var(--pdf-fg, #ddd); font: 14px system-ui, sans-serif; text-align: center; }
  #pdf-error[hidden] { display: none; }   /* else its display above wins over hidden, and it covers the PDF */
  #pdf-scroll:focus { outline: none; }
  /* Highlights (pdf-pane.js): a layer between a page and its text layer; the highlight look of the preview. */
  .pdf-hl-layer { position: absolute; inset: 0; pointer-events: none; }
  .pdf-hl { position: absolute; background: var(--pdf-hl); border-radius: 2px; }
  .pdf-hl.pdf-hl-under { background: none; border-bottom: 2px solid var(--pdf-hl-line); }
  .pdf-hl.pdf-hl-blink { background: rgb(255 140 0 / .6); }
  .pdf-hl-sign { position: absolute; width: 6px; height: 6px; margin: 1px 0 0 1px; border-radius: 50%; background: var(--pdf-hl-line); }
  /* The find bar's matches (pdf-pane.js): the window's find colours. */
  .pdf-find { position: absolute; background: var(--pdf-find); border-radius: 2px; }
  .pdf-find.pdf-find-current { background: var(--pdf-find-current); }
</style>
</head>
<body>
<div id="pdf-scroll" tabindex="0"><div id="pdf-pages" class="pdfViewer"></div></div>
<div id="pdf-error" hidden></div>
<script type="module" src="pdf-pane.js"></script>
</body></html>
