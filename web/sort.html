<!doctype html>
<!-- The Sort panel as a page of its own (sort-pane.js; docs/plans/executed/PLAN-sort-lines.md 3.3). -->
<html><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:">
<title>Sort</title>
<link rel="stylesheet" href="app.css">
<style>
  body { background: var(--bg-side); color: var(--fg); display: flex; flex-direction: column; height: 100vh; margin: 0; overflow: hidden;
    font-family: var(--app-font); font-size: calc(13px * var(--ui-scale, 1)); }
  input, select, button { font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--border); border-radius: 3px; }
  input:not([type]), select { padding: 1px 4px; }
  input:focus, select:focus { outline: none; border-color: var(--accent); }
  input[type=checkbox], input[type=radio] { vertical-align: middle; margin: 0 3px 0 0; }
  button { padding: 2px 8px; background: var(--bg-bar); cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .45; cursor: default; }
  /* A menu here (Manage, a stored sort's right-click): its items as in every menu, not as the panel's buttons. */
  .mm-pane-menu button { border: 0; background: none; padding: 4px 12px; }
  .sp-head { padding: 6px 8px 0; }
  .sp-doc { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sp-dim { color: var(--fg-dim); font-weight: 400; }
  .sp-tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--border); margin-top: 4px; }
  .sp-tabs button { border: 0; border-bottom: 2px solid transparent; border-radius: 0; background: none; padding: 3px 10px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 65%; }
  .sp-tabs button.sp-on { border-bottom-color: var(--accent); color: var(--accent); }
  .sp-body { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 6px 8px 8px; gap: 6px; }
  .sp-kind { display: flex; gap: 14px; }
  .sp-keys { display: flex; flex-direction: column; gap: 3px; }
  .sp-key { display: flex; align-items: center; gap: 6px; padding: 2px 4px; border-radius: 4px; border: 1px solid transparent; }
  .sp-key.sp-focus { background: color-mix(in srgb, var(--accent) 8%, transparent); }
  .sp-key.sp-over { border-color: var(--accent); }
  .sp-key select[data-f=column] { flex: 1; min-width: 0; }
  .sp-grip { display: inline-flex; color: var(--fg-dim); cursor: grab; padding: 2px; border-radius: 3px; }
  .sp-grip:focus { outline: 1px solid var(--accent); }
  .sp-num { min-width: 1.3em; text-align: center; border-radius: 3px; font-weight: 600; font-size: .85em; }
  .sp-col { width: 5ch; }
  .sp-del { margin-left: auto; padding: 0 6px; }
  .sp-options { display: flex; flex-direction: column; gap: 3px; padding-top: 6px; border-top: 1px solid var(--border); }
  .sp-sub { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-left: 20px; }
  .sp-problem { color: var(--caution); }
  .sp-slow { color: var(--caution); font-size: .9em; cursor: pointer; }
  .sp-slow:hover, .sp-slow:focus { text-decoration: underline; outline: none; }
  .sp-preview { flex: 1; min-height: 4em; margin: 0; padding: 4px 6px; overflow: auto; background: var(--bg); border: 1px solid var(--border);
    border-radius: 3px; font: var(--editor-size)/var(--editor-line) var(--editor-font); white-space: pre; }
  .sp-preview [data-l] { cursor: default; }
  .sp-bar { display: flex; justify-content: flex-end; gap: 6px; }
  /* The stored sort's name left of the buttons; above them when both do not fit. */
  .sp-body > .sp-bar { flex-wrap: wrap; align-items: center; }
  .sp-name { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
  .sp-name:empty { display: none; }
  .sp-btns { display: flex; gap: 6px; margin-left: auto; flex: none; }
  .sp-bar.sp-compact .sp-full, .sp-bar:not(.sp-compact) .sp-manage { display: none; }
  .sp-main { border-color: var(--accent); }
  .sp-list { flex: 1; min-height: 4em; overflow: auto; border: 1px solid var(--border); border-radius: 3px; background: var(--bg); }
  .sp-list:focus { outline: none; border-color: var(--accent); }
  .sp-stored { display: flex; flex-direction: column; padding: 3px 6px; cursor: pointer; }
  .sp-stored.sp-sel { background: var(--select); }
  .sp-stored.sp-off { opacity: .5; }
  /* Between the templates and the others: the colour of an unfocused pane's outline (app.css .mm-doc-ring). */
  .sp-divider { border-top: 2px solid color-mix(in srgb, var(--pane-active) 40%, transparent); margin: 6px 6px; }
  .sp-none { padding: 8px; }
  .sp-empty { padding: 12px 8px; color: var(--fg-dim); }
</style>
</head><body>
<div class="sp-head"><div class="sp-doc"></div>
  <div class="sp-tabs"><button type="button" data-page="sort">Sort</button><button type="button" data-page="stored">Stored sorts</button></div></div>
<div class="sp-body"></div>
<script src="pane.js"></script>
<script src="sort-pane.js"></script>
</body></html>
