<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:">
<title>Settings - LexPen</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="settings.css">
</head>
<body class="st-body">
<header class="st-top">
  <input class="st-search" type="search" placeholder="Search settings" spellcheck="false" aria-label="Search settings">
  <span class="st-count"></span>
  <span class="st-legend" aria-label="What a setting belongs to"></span>
</header>
<nav class="st-tabs" aria-label="Groups"></nav>
<div class="st-problems" hidden></div>
<main class="st-list" tabindex="-1"></main>
<!-- File types (docs/plans/executed/PLAN-file-types.md): which extensions Explorer opens in LexPen, to edit or to view. -->
<dialog class="st-ft">
  <div class="st-ft-top">
    <span class="st-ft-title">File types</span>
    <input class="st-ft-filter" type="search" placeholder="Filter on extension or language" spellcheck="false">
  </div>
  <div class="st-ft-scroll">
    <table class="st-ft-table">
      <thead><tr><th></th><th data-sort="extension">Extension</th><th data-sort="languageName">Language</th>
        <th data-sort="as">Opens as</th><th data-sort="opensWith">Opens now with</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>
  <div class="st-ft-note"></div>
  <div class="st-ft-buttons">
    <button data-ft="all" title="Checks the rows shown">Check all</button>
    <button data-ft="none" title="Unchecks the rows shown">Check none</button>
    <button data-ft="edit" title="The rows shown: opened to edit, and checked">All edit</button>
    <button data-ft="view" title="The rows shown: opened to view (the project for viewing), and checked">All view</button>
    <span class="st-ft-gap"></span>
    <button data-ft="assign" title="Every row, also the ones the filter hides: asks first">Assign</button>
    <button data-ft="cancel">Close</button>
  </div>
</dialog>
<div class="st-set">
  <span class="st-layer" data-layer="set"></span>
  <span class="st-set-text">Theme set of this project:</span>
  <select class="st-set-select" title="This project's own theme set; none: its desktop's default, else the app's"></select>
  <span class="st-set-source"></span>
  <span class="st-set-message" hidden></span>
  <button class="st-set-undo" hidden>Undo</button>
  <span class="st-set-gap"></span>
  <button class="st-set-manage">Manage theme sets...</button>
</div>
<div class="st-layout">
  <span class="st-layout-text">This window's layout:</span>
  <button data-layout="save">Save as default</button>
  <button data-layout="reset">Reset to default</button>
</div>
<footer class="st-foot">
  A change applies at once in every LexPen window. Your settings file holds only what you changed:
  <button class="st-link" data-open="settings">open settings.json</button>
</footer>
<script src="fontlist.js"></script>
<script src="settings.js"></script>
</body>
</html>
