<!doctype html>
<!-- The Clipboards pane as a page of its own (clipboards-pane.js; docs/plans/24-PLAN-docking.md stage 12). -->
<html><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:">
<title>Clipboards</title>
<link rel="stylesheet" href="app.css">
<style>
  body { background: var(--bg-side); color: var(--fg); display: flex; flex-direction: column; height: 100vh; margin: 0; overflow: hidden;
    font-family: var(--app-font); font-size: calc(13px * var(--ui-scale, 1)); }
  .cb-list { flex: 1; min-height: 0; overflow: auto; outline: none; padding: 4px 0; }
  .cb-row { display: flex; gap: 8px; align-items: baseline; padding: 4px 10px; cursor: pointer; white-space: nowrap; border-left: 3px solid transparent; }
  .cb-row:hover { background: var(--hover); }
  .cb-row.cb-active { border-left-color: var(--accent); background: var(--select); }
  .cb-name { flex: none; min-width: 7.5em; font-weight: 600; }
  .cb-active .cb-name::after { content: ' (active)'; font-weight: normal; color: var(--fg-dim); }
  .cb-text { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; font-family: var(--editor-font, Consolas, monospace); }
  .cb-empty .cb-text { color: var(--fg-dim); font-family: inherit; font-style: italic; }
  .cb-block { flex: none; color: var(--fg-dim); }
</style>
</head>
<body>
<div class="cb-list" tabindex="0"></div>
<script src="pane.js"></script>
<script src="clipboards-pane.js"></script>
</body></html>
