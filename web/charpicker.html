<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:">
<title>Characters - LexPen</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="charpicker.css">
</head>
<body class="cp-body">
<div class="mm-cp-top">
  <button class="mm-cp-blocks-toggle" title="The character blocks: show / hide">&laquo;</button>
  <label class="mm-cp-label" for="cp-search">Search</label>
  <input id="cp-search" class="mm-cp-search" placeholder="A code (e9, U+E9, #233), &amp;eacute;, a character or words of its name" spellcheck="false">
  <label class="mm-cp-all"><input type="checkbox"> <span class="cp-long">All characters</span><span class="cp-short">All chars</span></label>
  <input class="mm-cp-zoom" type="range" min="20" max="72" step="2" title="Size">
</div>
<div class="mm-cp-recent" title="Recently used" hidden></div>
<div class="mm-cp-body">
  <div class="mm-cp-blocks"></div>
  <div class="mm-cp-gridbox">
    <div class="mm-cp-grid" tabindex="0"><div class="mm-cp-space"></div></div>
    <div class="mm-cp-strip"></div>
  </div>
  <div class="mm-cp-info">
    <div class="mm-cp-big"></div><div class="mm-cp-code"></div><div class="mm-cp-name"></div><div class="mm-cp-bytes"></div>
    <div class="mm-cp-cursor" hidden>At the cursor: <span class="mm-cp-cursor-char"></span> <button class="mm-cp-cursor-go">Show</button></div>
  </div>
</div>
<div class="mm-cp-note" hidden></div>
<div class="mm-cp-bottom">
  <label class="mm-cp-label" for="cp-field">To insert</label>
  <input id="cp-field" class="mm-cp-field" placeholder="Characters to insert" spellcheck="false">
  <button class="mm-cp-clear" title="Empty the field">C<u>l</u>ear</button>
  <button class="mm-cp-insert" title="At the cursor(s) of the LexPen window you worked in last (the picker stays open)"><u>I</u>nsert</button>
  <button class="mm-cp-copy"><u>C</u>opy</button>
</div>
<script src="charpage.js"></script>
</body>
</html>
