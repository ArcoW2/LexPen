<!doctype html>
<!-- The Macros window as a page of its own (macros-pane.js; docs/plans/executed/PLAN-docking.md 7b): Manage (the list) or
     one macro's window; it docks and floats as the other panes. -->
<html><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:">
<title>Macros</title>
<link rel="stylesheet" href="app.css">
<style>
  body { background: var(--bg-side); color: var(--fg); display: flex; flex-direction: column; height: 100vh; margin: 0; overflow: hidden;
    font-family: var(--app-font); font-size: calc(13px * var(--ui-scale, 1)); }
  .mp-body { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 8px; padding: 10px 12px; overflow: auto; }
  .mp-title { margin: 0; font-size: 1.15em; font-weight: 600; }
  .mp-list { flex: 1 1 auto; min-height: 6em; overflow: auto; outline: none; color: var(--fg); background: var(--bg); border: 1px solid var(--border); }
  body:not([data-manage]) .mp-list, body:not([data-manage]) .mp-manage { display: none; }
  /* The chosen macro as the Folder pane's active row: the theme's colour; with the keyboard in the list, outlined. */
  .mp-row { padding: 2px 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: default; }
  .mp-row:hover { background: var(--hover); }
  .mp-row.mp-on { background: var(--active); }
  .mp-list:focus .mp-row.mp-on { box-shadow: inset 0 0 0 1px var(--accent); }
  .mp-keys { color: var(--fg-dim); }
  .mp-key { margin: 0; min-height: 1.2em; color: var(--fg-dim); }
  .mp-buttons { display: flex; flex-wrap: wrap; gap: 6px; }
  .mp-buttons button { padding: 4px 10px; border: 1px solid var(--border); border-radius: 4px; background: var(--bg-bar); color: var(--fg); font: inherit; }
  .mp-buttons button:hover:not(:disabled) { border-color: var(--accent); }
  .mp-buttons button:disabled { opacity: .45; }
  /* A button whose menu is open: pressed in, its chevron pointing up. */
  .mp-buttons button.mp-open { background: var(--active); border-color: var(--accent); }
  .mp-buttons .mp-drop.mp-open::after { transform: translateY(.1em) rotate(225deg); }
  /* A button with a menu: a down chevron after its text, as a drop-down box has. */
  .mp-buttons .mp-drop::after { content: ""; display: inline-block; width: .38em; height: .38em; margin: 0 2px 0 .6em;
    border: solid currentColor; border-width: 0 1.5px 1.5px 0; transform: translateY(-.2em) rotate(45deg); }
</style>
</head>
<body>
<div class="mp-body">
  <h1 class="mp-title">Macros</h1>
  <div class="mp-list" tabindex="0" role="listbox" aria-label="The stored macros"></div>
  <p class="mp-key"></p>
  <!-- Play, Edit and New open a menu of their own (macros.js: MACRO_MENUS), drawn by the window (docked) or this page (floating). -->
  <div class="mp-buttons">
    <button type="button" class="mp-one mp-drop" data-menu="play">Play</button><button type="button" class="mp-one mp-drop" data-menu="edit">Edit</button>
    <button type="button" class="mp-manage mp-drop" data-menu="new">New</button><button type="button" class="mp-one" data-macro="delete">Delete...</button>
  </div>
</div>
<script src="pane.js"></script>
<script src="macros-pane.js"></script>
</body></html>
